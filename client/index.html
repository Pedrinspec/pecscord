<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pecscord</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Cpath d='M9 11h14v9H14l-4 3v-3H9z' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --surface-2: #1f2430;
        --border: #2a3040;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --accent: #5b8def;
        --accent-hover: #4a7be0;
        --danger: #e5484d;
        --radius: 10px;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button, input, select {
        font: inherit;
        color: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        padding: 8px 12px;
      }
      input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button { cursor: pointer; }
      button:hover { background: #263041; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: var(--accent-hover); }
      button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }

      /* ---- tela de entrada ---- */
      #join {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 24px;
      }
      .card h1 { margin: 0 0 4px; font-size: 28px; }
      .card p { margin: 0 0 20px; color: var(--muted); }
      .card form { display: grid; gap: 10px; }
      .card label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      .card label input { width: 100%; }

      /* ---- sala ---- */
      #room-view {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      header .brand { font-weight: 700; }
      header .sep { color: var(--muted); }
      header #room-name { color: var(--muted); }
      header #leave { margin-left: auto; }

      .layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        min-height: 0;
      }

      /* área de mídia */
      #media {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 0;
        padding: 12px;
        gap: 12px;
      }
      #videos {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 10px;
        min-height: 0;
      }
      #videos:has(#stage[hidden]) { grid-template-rows: 1fr; }

      /* palco: telas compartilhadas, lado a lado se houver mais de uma */
      #stage {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 10px;
        min-height: 0;
      }
      #stage .tile video { width: 100%; height: 100%; object-fit: contain; }

      /* faixa: câmeras. Vira grade grande quando não há tela no palco. */
      #strip {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(180px, 240px);
        gap: 10px;
        overflow-x: auto;
      }
      #videos:has(#stage[hidden]) #strip {
        grid-auto-flow: row;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        grid-auto-columns: unset;
        align-content: center;
        overflow: visible;
      }
      #strip .tile { aspect-ratio: 16 / 9; }
      #strip .tile video { width: 100%; height: 100%; object-fit: cover; }

      .tile {
        position: relative;
        min-height: 0;
        background: #000;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .tile[data-peer="local"] { border-color: var(--accent); }
      .tile span {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 12px;
      }

      #empty-hint {
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }
      #videos:has(.tile:not([hidden])) #empty-hint { display: none; }

      /* barra de controles */
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      #controls .group { display: flex; gap: 6px; align-items: center; }
      #controls label { font-size: 13px; color: var(--muted); }

      /* lateral: pessoas + chat */
      #side {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        min-height: 0;
        background: var(--surface);
        border-left: 1px solid var(--border);
      }
      #side h2 {
        margin: 0;
        padding: 12px 14px 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #participants {
        list-style: none;
        margin: 0;
        padding: 0 14px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        border-bottom: 1px solid var(--border);
      }
      #participants li {
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        font-size: 13px;
      }
      #messages {
        list-style: none;
        margin: 0;
        padding: 8px 14px;
        overflow-y: auto;
        min-height: 0;
        font-size: 14px;
        line-height: 1.45;
      }
      #messages li { padding: 3px 0; overflow-wrap: anywhere; }
      #messages li.system { color: var(--muted); font-style: italic; }
      #messages li.error { color: var(--danger); }
      #chat-form {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      #chat-form input { flex: 1; min-width: 0; }

      #audio { display: none; }

      @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(220px, 40vh); }
        #side { border-left: 0; border-top: 1px solid var(--border); }
      }
    </style>
  </head>
  <body>
    <div id="join">
      <div class="card">
        <h1>Pecscord</h1>
        <p>Voz, câmera e tela para o seu grupo.</p>
        <form id="join-form">
          <label>Sala <input id="room" placeholder="ex.: jogatina" required autocomplete="off" /></label>
          <label>Seu nome <input id="name" placeholder="Como quer ser chamado" required autocomplete="nickname" /></label>
          <button type="submit" class="primary">Entrar</button>
        </form>
      </div>
    </div>

    <div id="room-view" hidden>
      <header>
        <span class="brand">Pecscord</span>
        <span class="sep">/</span>
        <span id="room-name"></span>
        <button type="button" id="leave" class="danger">Sair</button>
      </header>

      <div class="layout">
        <section id="media">
          <div id="videos">
            <div id="stage" hidden></div>
            <div id="strip"></div>
            <div id="empty-hint">Ninguém está com câmera ou tela ligada.</div>
          </div>

          <div id="controls">
            <button type="button" id="mute">Mutar</button>
            <button type="button" id="camera">Ligar câmera</button>
            <div class="group">
              <button type="button" id="screen">Compartilhar tela</button>
              <label for="screen-quality">Qualidade</label>
              <select id="screen-quality">
                <option value="720p30">720p · 30 fps</option>
                <option value="1080p60">1080p · 60 fps</option>
              </select>
            </div>
          </div>
        </section>

        <aside id="side">
          <h2>Pessoas</h2>
          <ul id="participants"></ul>
          <h2>Chat</h2>
          <ul id="messages"></ul>
          <form id="chat-form">
            <input id="text" placeholder="Digite uma mensagem" autocomplete="off" />
            <button type="submit" class="primary">Enviar</button>
          </form>
        </aside>
      </div>
    </div>

    <div id="audio"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
