<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pecscord</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Cpath d='M9 11h14v9H14l-4 3v-3H9z' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --surface-2: #1f2430;
        --border: #2a3040;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --accent: #5b8def;
        --accent-hover: #4a7be0;
        --danger: #e5484d;
        --surface-hover: #263041;
        --tile-border: var(--border);
        --radius: 10px;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button, input, select {
        font: inherit;
        color: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        padding: 8px 12px;
      }
      input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button { cursor: pointer; }
      button:hover { background: var(--surface-hover); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: var(--accent-hover); }
      button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }

      /* ---- tela de entrada ---- */
      #join {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 24px;
      }
      .card h1 { margin: 0 0 4px; font-size: 28px; }
      .card p { margin: 0 0 20px; color: var(--muted); }
      .card p.error { margin: 12px 0 0; color: var(--danger); font-size: 13px; }
      .card form { display: grid; gap: 10px; }
      .card label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      .card label input { width: 100%; }

      /* ---- sala ---- */
      #room-view {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      header .brand { font-weight: 700; }
      header .sep { color: var(--muted); }
      header #room-name { color: var(--muted); }
      header .theme-pick { margin-left: auto; }

      .layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        min-height: 0;
      }

      /* área de mídia */
      #media {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 0;
        padding: 12px;
        gap: 12px;
      }
      #videos {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 10px;
        min-height: 0;
      }
      #videos:has(#stage[hidden]) { grid-template-rows: 1fr; }

      /* palco: telas compartilhadas, lado a lado se houver mais de uma */
      #stage {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 10px;
        min-height: 0;
      }
      #stage .tile video { width: 100%; height: 100%; object-fit: contain; }

      /* faixa: câmeras. Vira grade grande quando não há tela no palco. */
      #strip {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(180px, 240px);
        gap: 10px;
        overflow-x: auto;
      }
      #videos:has(#stage[hidden]) #strip {
        grid-auto-flow: row;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        grid-auto-columns: unset;
        align-content: center;
        overflow: visible;
      }
      #strip .tile { aspect-ratio: 16 / 9; }
      #strip .tile video { width: 100%; height: 100%; object-fit: cover; }

      .tile {
        position: relative;
        min-height: 0;
        background: #000;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--tile-border);
      }
      .tile[data-peer="local"] { border-color: var(--accent); }
      .tile span {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 12px;
      }

      .tile .max {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 2px 8px;
        font-size: 14px;
        line-height: 1.4;
        background: rgba(0, 0, 0, 0.65);
        border-color: transparent;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .tile:hover .max, .tile.focused .max { opacity: 1; }

      /* modo grade: câmeras e telas com o mesmo tamanho, dividindo toda a área */
      #videos[data-layout="grid"],
      #videos[data-layout="grid"]:has(#stage[hidden]) {
        grid-template-rows: none;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
        grid-auto-rows: auto;
        align-content: center;
        overflow-y: auto;
      }
      #videos[data-layout="grid"] #stage,
      #videos[data-layout="grid"] #strip { display: contents; }
      #videos[data-layout="grid"] .tile { aspect-ratio: 16 / 9; height: auto; }
      #videos[data-layout="grid"] .tile video { width: 100%; height: 100%; object-fit: contain; }

      /* tile maximizado: ocupa toda a área de mídia, os outros somem */
      #videos.focus {
        grid-template-rows: 1fr;
        grid-template-columns: 1fr;
        overflow: hidden;
      }
      #videos.focus #stage,
      #videos.focus #strip { display: contents; }
      #videos.focus .tile:not(.focused) { display: none !important; }
      #videos.focus .tile.focused { aspect-ratio: auto; height: 100%; }
      #videos.focus .tile.focused video { width: 100%; height: 100%; object-fit: contain; }

      #empty-hint {
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }
      #videos:has(.tile:not([hidden])) #empty-hint { display: none; }

      /* barra de controles */
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      #controls .group { display: flex; gap: 6px; align-items: center; }
      #controls label { font-size: 13px; color: var(--muted); }
      #controls .option { display: flex; gap: 4px; align-items: center; cursor: pointer; }
      #controls .option input { accent-color: var(--accent); margin: 0; }

      /* lateral: pessoas + chat */
      #side {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        background: var(--surface);
        border-left: 1px solid var(--border);
      }
      #people { border-bottom: 1px solid var(--border); }
      #chat {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 0;
      }
      #side h2 {
        margin: 0;
        padding: 12px 14px 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #participants {
        list-style: none;
        margin: 0;
        padding: 0 14px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #participants li {
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        font-size: 13px;
      }
      #participants li[data-peer] { cursor: pointer; }
      #participants li[data-peer]:hover { background: var(--surface-hover); }
      #participants li.selected { outline: 2px solid var(--accent); }
      #participants li.quiet { color: var(--muted); }

      /* painel de volume de uma pessoa: voz e tela separados */
      #volume-panel {
        display: grid;
        gap: 6px;
        padding: 0 14px 12px;
        font-size: 13px;
      }
      .volume-head { display: flex; align-items: center; justify-content: space-between; }
      .volume-head #volume-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .volume-head button { padding: 0 8px; font-size: 16px; line-height: 1.4; background: none; border-color: transparent; color: var(--muted); }
      .volume-row { display: grid; grid-template-columns: 34px 1fr 44px auto; align-items: center; gap: 8px; }
      .volume-row > span:first-child { color: var(--muted); }
      .volume-row input[type="range"] { width: 100%; min-width: 0; padding: 0; background: none; border: 0; accent-color: var(--accent); }
      .volume-row > span:nth-child(3) { text-align: right; color: var(--muted); }
      .volume-row button { padding: 3px 8px; font-size: 12px; }
      .volume-row button.active { background: var(--danger); border-color: var(--danger); color: #fff; }

      .tile .vol {
        position: absolute;
        top: 8px;
        right: 44px;
        padding: 2px 8px;
        font-size: 14px;
        line-height: 1.4;
        background: rgba(0, 0, 0, 0.65);
        border-color: transparent;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .tile:hover .vol, .tile.focused .vol { opacity: 1; }
      #messages {
        list-style: none;
        margin: 0;
        padding: 8px 14px;
        overflow-y: auto;
        min-height: 0;
        font-size: 14px;
        line-height: 1.45;
      }
      #messages li { padding: 3px 0; overflow-wrap: anywhere; }
      #messages li.system { color: var(--muted); font-style: italic; }
      #messages li.error { color: var(--danger); }
      #chat-form {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      #chat-form input { flex: 1; min-width: 0; }

      #audio { display: none; }

      @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(220px, 40vh); }
        #side { border-left: 0; border-top: 1px solid var(--border); }
      }

      /* seletor de tema: discreto no canto do cartão de entrada e no cabeçalho da sala */
      .theme-pick { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
      .theme-pick select { padding: 4px 8px; font-size: 13px; }
      .card .theme-pick { justify-content: flex-end; margin-top: 16px; }

      /* ---- tema vaporwave: pôr do sol neon, grade no horizonte e brilho rosa/ciano ---- */
      :root[data-theme="vaporwave"] {
        --bg: #170a2b;
        --surface: rgba(30, 12, 58, 0.82);
        --surface-2: #35175f;
        --surface-hover: #472380;
        --border: rgba(255, 113, 206, 0.45);
        --tile-border: rgba(1, 205, 254, 0.55);
        --text: #fdf2ff;
        --muted: #b9a0dc;
        --accent: #ff71ce;
        --accent-hover: #ff4fc0;
        --danger: #ff5e7e;
        --radius: 6px;
      }
      :root[data-theme="vaporwave"] body {
        background: linear-gradient(180deg, #2a0a58 0%, #170a2b 52%, #061a3a 100%) fixed;
      }
      /* sol listrado atrás de tudo */
      :root[data-theme="vaporwave"] body::after {
        content: "";
        position: fixed;
        left: 50%;
        bottom: 36vh;
        width: 340px;
        height: 340px;
        transform: translateX(-50%);
        border-radius: 50%;
        background:
          repeating-linear-gradient(to bottom, transparent 0 16px, #170a2b 16px 24px) bottom / 100% 50% no-repeat,
          linear-gradient(#ffd27a, #ff71ce 55%, #b967ff);
        opacity: 0.95;
        filter: drop-shadow(0 0 40px rgba(255, 113, 206, 0.45));
        z-index: -2;
        pointer-events: none;
      }
      /* grade em perspectiva no chão */
      :root[data-theme="vaporwave"] body::before {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 48vh;
        background-image:
          linear-gradient(rgba(1, 205, 254, 0.6) 1px, transparent 1px),
          linear-gradient(90deg, rgba(1, 205, 254, 0.6) 1px, transparent 1px);
        background-size: 100% 36px, 56px 100%;
        transform: perspective(320px) rotateX(58deg);
        transform-origin: bottom;
        -webkit-mask-image: linear-gradient(to top, #000 20%, transparent);
        mask-image: linear-gradient(to top, #000 20%, transparent);
        z-index: -1;
        pointer-events: none;
      }
      :root[data-theme="vaporwave"] .card { background: rgba(30, 12, 58, 0.62); }
      :root[data-theme="vaporwave"] .card,
      :root[data-theme="vaporwave"] #controls,
      :root[data-theme="vaporwave"] header,
      :root[data-theme="vaporwave"] #side {
        backdrop-filter: blur(6px);
        box-shadow: 0 0 0 1px rgba(1, 205, 254, 0.12), 0 0 24px rgba(255, 113, 206, 0.12);
      }
      :root[data-theme="vaporwave"] .card h1,
      :root[data-theme="vaporwave"] header .brand {
        font-style: italic;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: -2px 0 #01cdfe, 2px 0 #ff71ce, 0 0 18px rgba(255, 113, 206, 0.7);
      }
      :root[data-theme="vaporwave"] button.primary,
      :root[data-theme="vaporwave"] button.active {
        background: linear-gradient(135deg, #ff71ce, #b967ff);
        border-color: transparent;
        box-shadow: 0 0 12px rgba(255, 113, 206, 0.6);
      }
      :root[data-theme="vaporwave"] button.primary:hover,
      :root[data-theme="vaporwave"] button.active:hover { background: linear-gradient(135deg, #ff4fc0, #a94dff); }
      :root[data-theme="vaporwave"] button.danger { background: linear-gradient(135deg, #ff5e7e, #ff8a5c); border-color: transparent; }
      :root[data-theme="vaporwave"] .tile { box-shadow: 0 0 14px rgba(1, 205, 254, 0.25); }
      :root[data-theme="vaporwave"] .tile[data-peer="local"] { box-shadow: 0 0 14px rgba(255, 113, 206, 0.45); }
      :root[data-theme="vaporwave"] #participants li.selected { outline-color: #01cdfe; }
      :root[data-theme="vaporwave"] #side h2 { color: #01cdfe; text-shadow: 0 0 8px rgba(1, 205, 254, 0.6); }
      :root[data-theme="vaporwave"] input:focus,
      :root[data-theme="vaporwave"] select:focus,
      :root[data-theme="vaporwave"] button:focus-visible { outline-color: #01cdfe; }
      :root[data-theme="vaporwave"] #empty-hint { text-shadow: 0 0 10px rgba(185, 103, 255, 0.6); }
    </style>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não piscar o tema padrão.
      try {
        var t = localStorage.getItem("pecscord-theme");
        if (t === "vaporwave") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="join">
      <div class="card">
        <h1>Pecscord</h1>
        <p>Voz, câmera e tela para o seu grupo.</p>
        <form id="join-form">
          <label>Sala <input id="room" placeholder="ex.: jogatina" required autocomplete="off" /></label>
          <label>Seu nome <input id="name" placeholder="Como quer ser chamado" required autocomplete="nickname" /></label>
          <button type="submit" class="primary">Entrar</button>
        </form>
        <p id="join-error" class="error" hidden></p>
        <div class="theme-pick">
          <label for="theme-join">Tema</label>
          <select id="theme-join" data-theme-select>
            <option value="default">Padrão</option>
            <option value="vaporwave">Vaporwave</option>
          </select>
        </div>
      </div>
    </div>

    <div id="room-view" hidden>
      <header>
        <span class="brand">Pecscord</span>
        <span class="sep">/</span>
        <span id="room-name"></span>
        <div class="theme-pick">
          <label for="theme-room">Tema</label>
          <select id="theme-room" data-theme-select>
            <option value="default">Padrão</option>
            <option value="vaporwave">Vaporwave</option>
          </select>
        </div>
        <button type="button" id="leave" class="danger">Sair</button>
      </header>

      <div class="layout">
        <section id="media">
          <div id="videos" data-layout="stage">
            <div id="stage" hidden></div>
            <div id="strip"></div>
            <div id="empty-hint">Ninguém está com câmera ou tela ligada.</div>
          </div>

          <div id="controls">
            <button type="button" id="mute">Mutar</button>
            <button type="button" id="camera">Ligar câmera</button>
            <div class="group">
              <button type="button" id="screen">Compartilhar tela</button>
              <label for="screen-quality">Qualidade</label>
              <select id="screen-quality">
                <option value="720p30">720p · 30 fps</option>
                <option value="1080p60">1080p · 60 fps</option>
              </select>
            </div>
            <div class="group">
              <label for="layout">Layout</label>
              <select id="layout">
                <option value="stage">Palco</option>
                <option value="grid">Grade</option>
              </select>
            </div>
            <div class="group">
              <label class="option" title="Filtro de ruído do próprio navegador (ventilador, teclado, chiado)">
                <input type="checkbox" id="noise-suppression" checked />
                Supressão de ruído
              </label>
            </div>
          </div>
        </section>

        <aside id="side">
          <section id="people">
            <h2>Pessoas</h2>
            <ul id="participants"></ul>
            <div id="volume-panel" hidden>
              <div class="volume-head">
                <span id="volume-name"></span>
                <button type="button" id="volume-close" title="Fechar">×</button>
              </div>
              <div class="volume-row">
                <span>Voz</span>
                <input type="range" id="volume-mic" min="0" max="200" step="5" value="100" aria-label="Volume da voz" />
                <span id="volume-mic-value">100%</span>
                <button type="button" id="volume-mic-mute">Mutar</button>
              </div>
              <div class="volume-row">
                <span>Tela</span>
                <input type="range" id="volume-screen" min="0" max="200" step="5" value="100" aria-label="Volume da tela" />
                <span id="volume-screen-value">100%</span>
                <button type="button" id="volume-screen-mute">Mutar</button>
              </div>
            </div>
          </section>
          <section id="chat">
            <h2>Chat</h2>
            <ul id="messages"></ul>
            <form id="chat-form">
              <input id="text" placeholder="Digite uma mensagem" autocomplete="off" />
              <button type="submit" class="primary">Enviar</button>
            </form>
          </section>
        </aside>
      </div>
    </div>

    <div id="audio"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
